<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provenance | Reasoning Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/dash.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="left-panel" aria-label="Engine controls">
      <div class="brand">
        <div class="brand-mark"><i class="ph-fill ph-brain"></i></div>
        <div>
          <h1>Provenance</h1>
          <p>Reasoning Engine</p>
        </div>
      </div>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="./dashboard.html" data-route="dashboard" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
        <a href="./dash.html" data-route="ask" class="nav-item active"><i class="ph ph-chat-circle-dots"></i> Ask AI</a>
        <a href="./decision-explorer.html" data-route="decision" class="nav-item"><i class="ph ph-graph"></i> Decision Explorer</a>
        <a href="./source-library.html" data-route="sources" class="nav-item"><i class="ph ph-books"></i> Source Library</a>
        <a href="./conflict-checker.html" data-route="conflicts" class="nav-item"><i class="ph ph-warning-circle"></i> Conflict Checker</a>
      </nav>

      <section class="card controls-card">
        <h2>Data Sources</h2>
        <label class="switch-row"><span><i class="ph ph-slack-logo"></i> Slack</span><input type="checkbox" checked disabled /></label>
        <label class="switch-row"><span><i class="ph ph-envelope"></i> Gmail</span><input type="checkbox" checked disabled /></label>
        <label class="switch-row"><span><i class="ph ph-github-logo"></i> GitHub</span><input type="checkbox" checked disabled /></label>
      </section>

      <button id="clear-chat" class="btn ghost full"><i class="ph ph-trash"></i> Clear Chat</button>
    
      <div class="left-footer">
        <a href="./settings.html" data-route="settings" class="nav-item footer-item"><i class="ph ph-gear"></i> Settings</a>
        <a href="./login.html" data-route="login" class="nav-item footer-item danger"><i class="ph ph-sign-out"></i> Logout</a>
      </div>

    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="search-wrap">
          <i class="ph ph-magnifying-glass"></i>
          <input id="global-search" type="text" placeholder="Ask anything about company decisions..." aria-label="Global search" />
        </div>
        <div class="top-actions">
          <button class="icon-btn" aria-label="Notifications"><i class="ph ph-bell"></i></button>
          <a href="./login.html" data-route="login" class="icon-btn" aria-label="Profile"><i class="ph ph-user-circle"></i></a>
        </div>
      </header>

      <section id="chat-history" class="chat-history" aria-live="polite"></section>

      <form id="chat-form" class="composer" autocomplete="off">
        <input id="prompt-input" type="text" placeholder="Type your question here..." aria-label="Prompt input" />
        <button id="send-btn" class="btn primary" type="submit"><i class="ph ph-paper-plane-right"></i> Send</button>
      </form>
    </main>

    <aside class="right-panel" aria-label="Insights and sources">
      <section class="card">
        <div class="card-head">
          <h2>Sources & Graph</h2>
          <span id="confidence-pill" class="pill">--</span>
        </div>
        <div id="source-list" class="list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Decision Graph</h2>
          <i class="ph ph-caret-right"></i>
        </div>
        <div id="mini-graph" class="mini-graph" role="img" aria-label="Decision graph visualization"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Suggestions</h2>
          <i class="ph ph-sparkle"></i>
        </div>
        <ul id="suggestion-list" class="suggestions"></ul>
      </section>
    </aside>
  </div>

  <script src="../js/routes.js"></script>
  <script src="../js/mockData.js"></script>
  <script src="../js/dash.js"></script>
</body>
</html>
