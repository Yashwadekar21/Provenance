<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Provenance</title>
  <link rel="stylesheet" href="../css/settings.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="app-shell two-col">
    <aside class="left-panel">
      <div class="brand"><div class="brand-mark"><i class="ph-fill ph-brain"></i></div><div><h1>Provenance</h1><p>Reasoning Engine</p></div></div>
      <nav class="primary-nav">
        <a href="./dashboard.html" data-route="dashboard" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
        <a href="./dash.html" data-route="ask" class="nav-item"><i class="ph ph-chat-circle-dots"></i> Ask AI</a>
        <a href="./decision-explorer.html" data-route="decision" class="nav-item"><i class="ph ph-graph"></i> Decision Explorer</a>
        <a href="./source-library.html" data-route="sources" class="nav-item"><i class="ph ph-books"></i> Source Library</a>
        <a href="./conflict-checker.html" data-route="conflicts" class="nav-item"><i class="ph ph-warning-circle"></i> Conflict Checker</a>
      </nav>
      <div class="left-footer">
        <a href="./settings.html" data-route="settings" class="nav-item footer-item active"><i class="ph ph-gear"></i> Settings</a>
        <a href="./login.html" data-route="login" class="nav-item footer-item danger"><i class="ph ph-sign-out"></i> Logout</a>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="menu-toggle" aria-label="Toggle menu"><i class="ph ph-list"></i></button>
        <div class="search-wrap">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" placeholder="Ask anything about company decisions..." aria-label="Global decision search" />
        </div>
        <div class="top-actions">
          <button class="icon-btn" aria-label="Notifications"><i class="ph ph-bell"></i></button>

        </div>
      </header>
      <section class="chat-history">
        <article class="card settings-card">
          <h3>AI Response Style</h3>
          <p class="settings-help">Choose how answers are generated in chat responses.</p>
          <label class="settings-field">
            <span>Response mode</span>
            <select id="response-mode">
              <option value="detailed">Detailed</option>
              <option value="concise">Concise</option>
            </select>
          </label>
          <label class="settings-check">
            <input id="show-reasoning" type="checkbox" />
            <span>Show chain of reasoning in responses</span>
          </label>
        </article>

        <article class="card settings-card">
          <h3>Notifications</h3>
          <p class="settings-help">Email + in-app notifications are active.</p>
          <label class="settings-check">
            <input id="notify-email" type="checkbox" checked />
            <span>Email notifications</span>
          </label>
          <label class="settings-check">
            <input id="notify-inapp" type="checkbox" checked />
            <span>In-app notifications</span>
          </label>
        </article>
      </section>
      <div class="composer"><a class="btn primary" href="./dash.html" data-route="ask">Back to Chat</a></div>
    </main>
  </div>
  <script src="../js/routes.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
