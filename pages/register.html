<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Provenance</title>
  <link rel="stylesheet" href="../css/dash.css" />
</head>
<body>
  <main class="app-shell" style="grid-template-columns:minmax(0,520px);place-content:center;">
    <section class="workspace" style="padding:20px;">
      <h2>Create account</h2>
      <p style="color:#64748b;">Demo registration page.</p>
      <form class="composer" style="grid-template-columns:1fr;border-top:none;padding:0;margin-top:12px;">
        <input type="text" placeholder="Full name" />
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button class="btn primary" type="button">Create Account</button>
      </form>
      <p style="margin-top:10px;"><a href="./login.html" data-route="login">Already have an account?</a></p>
      <p><a href="./dash.html" data-route="ask">Back to app</a></p>
    </section>
  </main>
  <script src="../js/routes.js"></script>
  <script>window.bindRouteNavigation();</script>
</body>
</html>
